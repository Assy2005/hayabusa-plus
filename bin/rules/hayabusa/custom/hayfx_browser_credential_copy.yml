title: Browser Credential Database Copy Via Esentutl
id: hayfx-browser-credential-copy
status: experimental
description: |
  Detects esentutl.exe copying Chromium or Edge credential databases
  (Login Data, Web Data, Cookies, Local State). Infostealers and
  hands-on-keyboard actors use this to bypass file locks before exfiltration.
author: hayabusa-fx
date: 2026/11/05
references:
  - https://attack.mitre.org/techniques/T1555/003/
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    Channel: 'Microsoft-Windows-Sysmon/Operational'
    EventID: 1
    Image|endswith: '\esentutl.exe'
    CommandLine|contains:
      - '\Login Data'
      - '\Web Data'
      - '\Cookies'
      - '\Local State'
  condition: selection
falsepositives:
  - Browser-support or forensic collection scripts that intentionally copy these files.
level: medium
tags:
  - attack.credential_access
  - attack.t1555.003
