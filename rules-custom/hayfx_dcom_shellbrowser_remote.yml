title: Remote DCOM Activation Failure For Shell Browser
id: hayfx-dcom-shellbrowser-remote
status: experimental
description: Detects DCOM 10016 activation failures for ShellBrowserWindow/ShellWindows from a remote principal.
author: hayabusa-fx
date: 2026/11/05
references:
  - https://attack.mitre.org/techniques/T1021/003/
logsource:
  product: windows
  service: system
detection:
  selection:
    Channel: 'System'
    EventID: 10016
    param2: 'Remote'
    param4|contains:
      - '{C08AFD90-F2A1-11D1-8455-00A0C91F3880}'
      - '{9BA05972-F6A8-11CF-A442-00A0C90A8F39}'
  condition: selection
falsepositives:
  - Remote administration and legacy COM applications.
level: medium
tags:
  - attack.lateral_movement
  - attack.t1021.003
